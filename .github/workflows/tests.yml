name: tests

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local tool dependencies
        run: python -m pip install -r tools/requirements.txt
      - name: Compile Python tools
        run: python -m compileall -q hooks tools
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Run parser, metrics, search and fetch smoke pipeline
        run: python tools/demo_pipeline_smoke.py --project fictional-operator
      - name: Upload tool-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fictional-operator-tool-run
          path: |
            projects/fictional-operator/materials/parsed/
            projects/fictional-operator/output/metrics/
            projects/fictional-operator/output/tool_runs/
            projects/second-brief/materials/parsed/
            projects/second-brief/output/metrics/
            projects/fictional-operator/state/budget.json
            COSTS.md
            knowledge/sources/registry.md
            knowledge/sources/cache/*.meta.json
            knowledge/sources/cache/*.md
            knowledge/sources/search/*.json
          if-no-files-found: warn
