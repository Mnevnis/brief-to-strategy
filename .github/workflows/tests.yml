name: tests

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python tools
        run: python -m compileall -q hooks tools
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
